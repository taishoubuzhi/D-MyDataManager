name: Build Application

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # v5 起改为 node24，避免 "Node.js 20 is deprecated" 里 checkout 这一条
        uses: actions/checkout@v5

      - name: Build with PyAppify Action
        uses: ok-oldking/pyappify-action@master
        with:
          version: "v1.2.3"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pyappify_dist/*
          # 标签名里带连字符（v1.1.0-beta.1、v1.1.0-rc.1）视为预发布：
          # 网页端标为 Pre-release，且不抢 Latest；纯版本号（v1.1.0）仍是正式版。
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
