# PyAppify 打包配置（配合 .github/workflows/build.yml 使用）
# 文档：https://github.com/ok-oldking/pyappify
#
# 打包输入是**本仓库在 tag 上的 git 检出**：启动器在用户机器上按 `git_url` 克隆代码，
# 再建独立 venv 装 `requirements.txt`。所以「排除体积大户」靠的是 .gitignore——
# `.venv/`、`PyQt-Fluent-Widgets/`（上游 qfluentwidgets 参考仓库）、`.packages/`、
# `stubs/`、`.resources/`、`.configs/`、各目录下的 `.tmp/`
# 都不在版本库里，配置里没有（也不需要）exclude/include 这类键。
name: "D-MyDataManager" # 仅支持英文
icon: "icons/icon.png"
website: "https://github.com/taishoubuzhi/D-MyDataManager"
profiles:
  - name: "release"
    # 用户端从这里按标签克隆代码，并在本机创建独立 venv 安装依赖
    git_url: "https://github.com/taishoubuzhi/D-MyDataManager.git"
    main_script: "src/main.py"
    # 打包解释器必须落在 pyappify 启动器硬编码的 KNOWN_PATCHES 表里：v1.2.3（master 也
    # 一样）只有 3.7 / 3.8 / 3.9 / 3.10 / 3.11 / 3.12 / 3.13，最高 3.13.5，没有 3.14。
    # 写 "3.14" 或 "3.14.5" 都会在 setup 阶段报 "Unsupported major.minor version for
    # resolving latest patch: 3.14" —— python_env.rs 的 parse_version 会把 patch 段丢掉，
    # get_latest_known_patch_for_major_minor 只按主次版本查表。
    # 因此打包锁 3.13：标准库没有 compression.zstd，由 requirements.txt 里的官方回移版
    # backports.zstd 顶上（API 与帧格式都和标准库互通，见 src/app/services/content_store.py）。
    requires_python: "3.13"
    requirements: "requirements.txt"
